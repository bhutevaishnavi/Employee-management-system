{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">Add Employee</h2>

    <div class="card shadow p-4">

        <form method="POST">

            {% csrf_token %}

            <input type="text" 
            name="name" 
            class="form-control mb-3"
            placeholder="Employee Name"
            required>


            <input type="email" 
            name="email" 
            class="form-control mb-3"
            placeholder="Email"
            required>


            <input type="text" 
            name="mobile" 
            class="form-control mb-3"
            placeholder="Mobile"
            required>


            <select name="department" class="form-select mb-3">

                <option value="">
                    Select Department
                </option>

                {% for d in departments %}
                <option value="{{d.id}}">
                    {{d.name}}
                </option>
                {% endfor %}

            </select>



            <select name="position" class="form-select mb-3">

                <option value="">
                    Select Position
                </option>

                {% for p in positions %}
                <option value="{{p.id}}">
                    {{p.name}}
                </option>
                {% endfor %}

            </select>



            <input type="number" 
            name="salary"
            class="form-control mb-3"
            placeholder="Salary"
            required>



            <input type="number" 
            name="experience"
            class="form-control mb-3"
            placeholder="Experience">


            <button type="submit" class="btn btn-primary">
                Add Employee
            </button>


        </form>

    </div>


</div>


{% endblock %}
