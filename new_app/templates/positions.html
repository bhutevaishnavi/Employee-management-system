{% extends 'base.html' %}


{% block title %}
Positions
{% endblock %}



{% block content %}


<h2 class="mb-3">Positions</h2>


<a href="{% url 'add_position' %}" 
class="btn btn-primary mb-3">

+ Add Position

</a>



<table class="table table-bordered table-striped">

<thead>

<tr>
<th>ID</th>
<th>Position</th>
<th>Action</th>
</tr>

</thead>


<tbody>

{% for p in positions %}

<tr>

<td>{{ p.id }}</td>

<td>{{ p.name }}</td>


<td>

<a href="{% url 'delete_position' p.id %}" 
class="btn btn-danger btn-sm">

Delete

</a>

</td>


</tr>


{% empty %}

<tr>

<td colspan="3" class="text-center">

No Position Found

</td>

</tr>


{% endfor %}


</tbody>

</table>


{% endblock %}
