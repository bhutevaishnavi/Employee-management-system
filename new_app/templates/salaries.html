 {% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<h2>Salary Management</h2>

<a href="/add-salary/" class="btn btn-primary mb-3">
    + Add Salary
</a>


<table class="table table-bordered">

<tr>
    <th>Employee</th>
    <th>Month</th>
    <th>Amount</th>
    <th>Action</th>
</tr>


{% for s in salaries %}

<tr>

<td>
{{s.employee.name}}
</td>


<td>
{{s.month}}
</td>


<td>
{{s.amount}}
</td>


<td>

<a href="/delete-salary/{{s.id}}/"
class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>


{% empty %}

<tr>
<td colspan="4">
No Salary Data
</td>
</tr>

{% endfor %}


</table>

</div>

{% endblock %}
