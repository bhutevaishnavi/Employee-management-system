{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-4">

<h2>Edit Profile</h2>

<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label>Name</label>

<input type="text"
name="name"
class="form-control"
value="{{ user.username }}">

</div>



<div class="mb-3">

<label>Email</label>

<input type="email"
name="email"
class="form-control"
value="{{ user.email }}">

</div>



<button type="submit" class="btn btn-primary">

Save Profile

</button>


</form>

</div>

{% endblock %}
