<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
    background:#243447;
    font-family:Arial;
}

.login-box{
    width:350px;
    margin:120px auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:#00bcd4;
    border:none;
    color:white;
    font-size:18px;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Employee Management Login</h2>

<form method="POST">

{% csrf_token %}

<input type="text" 
name="username" 
placeholder="Username">

<input type="password" 
name="password" 
placeholder="Password">

<button type="submit">
Login
</button>

</form>


{% if error %}
<p style="color:red">
{{error}}
</p>
{% endif %}


</div>

</body>
</html>
